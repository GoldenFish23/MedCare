version: '3.8'

services:
  app-dev:
    build:
      context: .
      dockerfile: dockerfile.dev
    container_name: medical_app_dev
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DB_PATH=/app/data/dev_medical.db 
    ports:
      - "3000:3000"
    command: npm run dev